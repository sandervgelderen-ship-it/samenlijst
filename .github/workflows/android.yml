name: Build en APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund

      - name: Types controleren
        run: npm run lint
        continue-on-error: true

      - name: Lijstlogica testen
        run: npm test

      - name: Web-app en server bouwen
        run: npm run build
        env:
          # Adres van de server (Cloud Run / AI Studio) voor de slimme functies in de Android-app.
          # Zet dit onder Settings > Secrets and variables > Actions > Variables als SAMENLIJST_API_URL.
          VITE_API_URL: ${{ vars.SAMENLIJST_API_URL }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      - name: Android SDK controleren
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 8
          echo "sdk.dir=$ANDROID_HOME" > /tmp/local.properties

      - name: Android-project voorbereiden
        env:
          # Inhoud van google-services.json uit de Firebase-console (Android-app com.samenlijst.app).
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/android-setup.cjs
          npx cap sync android
          cp /tmp/local.properties android/local.properties

      - name: Vaste ondertekensleutel plaatsen
        env:
          # Base64 van de debug-keystore. Zonder vaste sleutel krijgt elke build een andere
          # SHA-1 en weigert Google het inloggen.
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Vaste sleutel gebruikt. SHA-1:"
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep SHA1
          else
            echo "::warning::Geen ANDROID_DEBUG_KEYSTORE-secret: inloggen met Google werkt niet in deze APK."
          fi

      - name: APK bouwen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../samenlijst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: samenlijst-apk
          path: samenlijst.apk

      - name: APK publiceren als release "Laatste APK"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Laatste APK
          body: Automatisch gebouwd vanaf ${{ github.sha }}. Open deze pagina op je telefoon en download samenlijst.apk.
          files: samenlijst.apk
          make_latest: true
