name: Webversie (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund

      - name: Webversie bouwen
        run: npx vite build
        env:
          VITE_BASE: /samenlijst/
          # Geen eigen server: de AI loopt via Firebase AI Logic in hetzelfde Firebase-project.
          VITE_AI_MODE: firebase

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
